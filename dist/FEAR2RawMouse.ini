[RawMouse]
; 1 = fix active, 0 = disabled (game behaves as stock)
Enabled=1

; Overall speed multiplier. Lower = slower. Edit and restart the game.
Sensitivity=1.0

; 1 = scale raw counts by your Windows "pointer speed" slider (Control Panel >
; Mouse > Pointer Options), like the stock game did. Acceleration is NOT applied.
; 0 = pure 1:1 counts regardless of the Windows setting.
MatchWindowsSpeed=1

; Extra per-axis multipliers (applied on top of Sensitivity).
ScaleX=1.0
ScaleY=1.0

; 1 = disable the game's own mouse smoothing (the "InputRate" blend in
; GameClient.dll) no matter what the in-game option is set to.
ForceNoSmoothing=1

; 1 = ignore the Options-menu "Aim Sensitivity" slider, so only Sensitivity above
; decides speed. 0 = the slider still scales the mouse on top (stock behaviour).
; Note: with 1 the multiplier is exactly 1.0, so retune Sensitivity to taste.
IgnoreGameSensitivity=0

; 1 = write FEAR2RawMouse.log next to this file
Log=1
